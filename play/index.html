<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1430">
<title>Extraction Tycoon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23130d1f'/%3E%3Cpath d='M16 3 29 16 16 29 3 16Z' fill='none' stroke='%23ff8a3d' stroke-width='2'/%3E%3Cpath d='M10 19h4V9h-4zm7 4h4V6h-4z' fill='%23ff8a3d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">EXTRACTION<br><span>TYCOON</span></div>
    <div class="stat coin"><small>Coin</small><b id="hCoin">—</b><i id="hRate"></i></div>
    <div class="stat"><small>Ore at surface</small><b id="hSurface">—</b></div>
    <div class="stat hide-sm"><small>Sold so far</small><b id="hEarned">—</b></div>
    <div class="stat hide-sm"><small>Sim time</small><b id="hTime">—</b></div>
    <div class="spacer"></div>
    <span class="live" id="hLive">MINE RUNNING</span>
    <button class="pbtn" id="pauseBtn" type="button" aria-pressed="false">Pause</button>
    <button class="pbtn" type="button" data-forward="60">+1 min</button>
    <a class="pbtn hide-sm" href="../prototype/">Legacy ↗</a>
  </header>
  <main class="layout" id="layout">
    <section class="stage">
      <div class="canvas-wrap" id="cwrap">
        <canvas id="cv" aria-label="Animated pixel view of your mine, lift, ore yard and launch pad"></canvas>
        <div class="stage-tag" id="stageTag"></div>
        <div class="banner hidden" id="banner" role="status" hidden></div>
      </div>
      <div class="ticker" id="ticker"></div>
    </section>
    <section class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
