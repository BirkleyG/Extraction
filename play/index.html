<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130d1f">
<title>Extraction Tycoon — Local Playtest</title>
<meta name="description" content="A pixel-art mining colony sandbox. Dig, build your fleet, and sell ore when cargo leaves the pad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand">EXTRACTION<br><span>TYCOON</span></div>
    <div class="stat coin"><small>Coin</small><b id="hCoin">—</b><i id="hRate">— / min</i></div>
    <div class="stat"><small>Fleet</small><b id="hShips">—</b></div>
    <button class="hudbtn" data-act="tree" aria-label="Open colony profile"><span>GUILD</span><b id="hGuild">LOCAL</b></button>
    <div class="stat"><small>Mine</small><b id="run-state">—</b></div>
    <div class="stat hide-sm"><small>Surface Ore</small><b id="hOre">—</b></div>
    <div class="stat"><small>Local Time</small><b id="hTimer">00:00</b></div>
    <button class="quick-forward-button" type="button" data-forward="60">＋1 min</button>
    <div class="spacer"></div>
    <button class="icon-btn" data-act="settings" aria-label="Settings, save and local controls">⚙</button>
  </header>
  <main class="layout" id="layout">
    <section class="stage">
      <div class="canvas-wrap" id="cwrap">
        <canvas id="cv" aria-label="Your colony. Drag to pan, scroll or pinch to zoom, tap things to inspect."></canvas>
        <button class="mapbtn" id="mapBtn" data-act="togglemap" aria-label="Switch between mine view and planet map"><canvas id="mini"></canvas><span id="mapBtnLbl">MAP</span></button>
        <div class="stage-tag" id="stageTag">Single-player local test · multiplayer is not connected</div>
        <button class="paneltoggle" data-act="panel" aria-label="Show or hide the control panel" id="panelBtn">⟩</button>
        <div class="ctrl"><button data-act="zoom:in" aria-label="Zoom in">+</button><button data-act="zoom:out" aria-label="Zoom out">−</button><button data-act="zoom:fit" aria-label="Fit view">⤢</button></div>
        <div class="focusbar" id="focusbar"></div>
        <div class="alarm" id="alarm" hidden></div>
        <div class="tip" id="tip" hidden></div>
        <div class="mapcard" id="mapcard" hidden></div>
      </div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
    </section>
    <section class="panel">
      <nav class="tabs" id="tabs" role="tablist" aria-label="Colony desk"></nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </main>
  <div class="overlay" id="ov" hidden><div class="sheet" id="ovBody"></div></div>
  <div class="toast" id="toast" hidden aria-live="polite"></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
