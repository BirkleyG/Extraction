name: Backend foundation

on:
  push:
    paths:
      - 'backend/**'
      - 'play/**'
      - 'online/**'
      - 'index.html'
      - 'prototype/**'
      - 'docs/development/calibration/**'
      - '.nvmrc'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'play/**'
      - 'online/**'
      - 'index.html'
      - 'prototype/**'
      - 'docs/development/calibration/**'
      - '.nvmrc'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked backend dependencies
        working-directory: backend
        run: npm ci
      - name: Test playable sandbox transactions
        run: npm --prefix play test
      - name: Test accounting and command invariants
        working-directory: backend
        run: npm test
      - name: Regenerate production calibration evidence
        working-directory: backend
        run: npm run calibrate:production
      - name: Verify committed calibration reports match the generator
        run: git diff --exit-code -- docs/development/calibration
      - name: Test Firebase authority with isolated local emulators
        working-directory: backend
        run: npm run test:integration
      - name: Check legacy JavaScript syntax
        run: |
          node --check js/game.js
          node --check js/backend.js
          node --check js/config.js
      - name: Check online client syntax
        run: node --check play/online.js
