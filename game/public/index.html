<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#130d1f">
<title>Mineshaft Capital: Maker Guild</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/app/style.css">
<link rel="stylesheet" href="/guild/guild.css">
</head>
<body class="guild">
<div id="boot" class="boot"><div class="guild-seal">MG</div><p>Contacting the Maker Guild…</p></div>
<div id="app" hidden>
  <header class="hud">
    <div class="brand">MINESHAFT<span>CAPITAL</span><small id="gameVersion" class="ver" title="Game version"></small></div>
    <div class="stat coin"><small>Guild coin</small><b id="coin">0</b><i id="net"></i></div>
    <div class="stat day"><small id="day">Day 1</small><b><span id="left"></span><span class="lw"> left</span></b></div>
    <button class="stat rank" id="rankBtn" aria-label="Rank"><small>Rank</small><b><span id="rank">–</span> <span id="rankOf"></span></b></button>
    <div class="stat rp"><small>Research</small><b id="rp">0</b></div>
    <button class="stat spstat" id="spStat" hidden aria-label="Spectacle points"><small>SP</small><b id="sp">0</b></button>
    <span class="spacer"></span>
    <button class="icon-btn" id="logBtn" aria-label="Chronicle"><svg viewBox="0 0 8 8" width="18" height="18" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h6v8H1zm1 1v1h4V1zm0 2v1h4V3zm0 2v1h3V5z"/></svg><span id="logN" class="badge" hidden>0</span></button>
    <button class="icon-btn" id="gear" aria-label="Settings"><svg viewBox="0 0 8 8" width="18" height="18" shape-rendering="crispEdges"><path fill="currentColor" d="M3 0h2v1h1V0h1v2H6v1h2v2H6v1h1v2H6V7H5v1H3V7H2v1H1V6h1V5H0V3h2V2H1V0h1v1h1zm0 3v2h2V3z"/></svg></button>
  </header>
  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="map" aria-label="The planet"></canvas>
      <canvas id="inside" aria-label="Inside the operation" hidden></canvas>
      <div class="zoom" id="zoomBox"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomHome" aria-label="Back to your hub">◎</button></div>
      <div id="insideBar" class="insidebar" hidden></div>
      <div id="mode" class="modebar" hidden></div>
      <div id="card" class="card" hidden></div>
      <div id="calls" class="calls"></div>
    </section>
    <aside class="panel">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="tabbody" id="tabbody"></div>
    </aside>
  </main>
  <footer class="ticker" id="ticker"></footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="banner" class="banner"></div>
<script type="module" src="/guild/main.js"></script>
<script type="module">
  fetch('/api/config').then(r => r.json()).then(j => { if (j.version) document.getElementById('gameVersion').textContent = 'v' + j.version; }).catch(() => {});
</script>
</body>
</html>
